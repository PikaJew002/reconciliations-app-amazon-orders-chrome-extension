<!doctype html>
<html>

<head>
	<meta charset="utf-8">
	<title>Amazon Order Scraper</title>

	<style>
		body {
			width: 350px;
			margin: 0;
			padding: 16px;
			font-family: Arial, sans-serif;
		}

		h1 {
			margin: 0 0 12px;
			font-size: 18px;
		}

		h2 {
			margin: 0 0 8px;
			font-size: 14px;
		}

		button {
			width: 100%;
			margin-top: 8px;
			padding: 8px 12px;
			cursor: pointer;
		}

		button:first-of-type {
			margin-top: 0;
		}

		button:disabled {
			cursor: wait;
		}

		#status,
		#coverage {
			margin-top: 12px;
			font-size: 13px;
		}

		#coverage {
			color: #444;
		}

		#failed-section {
			margin-top: 12px;
		}

		#failed-list {
			margin: 0 0 8px;
			padding-left: 20px;
			font-size: 12px;
		}

		#output {
			margin-top: 12px;
			max-height: 500px;
			overflow: auto;
			white-space: pre-wrap;
			word-break: break-word;
			font-family: monospace;
			font-size: 11px;
			background: #f5f5f5;
			padding: 8px;
			border-radius: 4px;
		}
	</style>
</head>

<body>
	<h1>Amazon Order Scraper</h1>

	<button id="connect">
		Connect to Reconciliations
	</button>

	<button id="scrape">
		Scrape Current Page
	</button>

	<button id="send-to-spendable" style="display: none;">
		Send to Spendable
	</button>

	<div id="status"></div>
	<div id="coverage"></div>

	<div id="failed-section" style="display: none;">
		<h2>Failed imports</h2>
		<ul id="failed-list"></ul>
		<button id="retry-failed">Retry failed</button>
	</div>

	<pre id="output"></pre>

	<script type="module" src="popup.js"></script>
</body>

</html>
